name: Python package

on: [push, pull_request]

jobs:
  build:

    name: "build (${{ matrix.runs_on }}, ${{ matrix.python }})"
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        runs_on: ['macos-latest', 'macos-15-intel']
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - runs_on: macos-latest
            python: "3.14"
            coverage: true
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install CI/CD requirements
      if: matrix.coverage != true
      run: |
        pip install -r .ci/cicd-requirements.txt

    - name: Install project
      if: matrix.coverage != true
      run: |
        mkdir -p build
        python -m pip install --verbose -e . 2>&1 | tee build/ordinary-install.log

    - name: Check ordinary build controls
      if: matrix.coverage != true
      run: |
        python - <<'PY'
        from pathlib import Path
        log = Path('build/ordinary-install.log').read_text()
        for macro in ('CYTHON_TRACE', 'CYTHON_USE_SYS_MONITORING'):
            if '-D' + macro in log:
                raise SystemExit('Ordinary build unexpectedly enabled ' + macro)
        PY

    - name: Install coverage requirements
      if: matrix.coverage == true
      run: |
        mkdir -p build/coverage
        python -m pip install -r .ci/coverage-requirements.txt 2>&1 | tee build/coverage/requirements.log
        python -m pip check 2>&1 | tee build/coverage/dependency-check.log

    - name: Install instrumented project
      if: matrix.coverage == true
      env:
        PYOBJUS_COVERAGE: '1'
      run: |
        clang --version | tee build/coverage/compiler.log
        python -m pip install --no-build-isolation -e . 2>&1 | tee build/coverage/install.log
        python setup.py build_ext --inplace --force 2>&1 | tee build/coverage/build.log

    - name: Verify coverage fidelity and accounting
      if: matrix.coverage == true
      run: python -m pytest tools/coverage/tests -q 2>&1 | tee build/coverage/fidelity-tests.log

    - name: Build test libraries
      run: make test_lib 2>&1 | tee build/test-libraries.log

    - name: Test with pytest
      if: matrix.coverage != true
      run: python -m pytest tests -v

    # Exclude import pyobjus from hits; retain the full traceable-source inventory.
    - name: Test with post-bootstrap Python and Cython coverage
      if: matrix.coverage == true
      run: python -m tools.coverage.run 2>&1 | tee build/coverage/pytest.log

    - name: Finalize and validate coverage
      if: matrix.coverage == true
      run: |
        python -m tools.coverage.report --output coverage.xml --artifacts build/coverage 2>&1 | tee build/coverage/report.log
        python -m tools.coverage.report --output coverage.xml --check-fresh 2>&1 | tee build/coverage/fresh-report.log
        python -m tools.coverage.report --from-artifacts build/coverage --output build/coverage/replayed.xml 2>&1 | tee build/coverage/replay.log

    - name: Check an uncalled native body separately
      if: matrix.coverage == true
      run: |
        python -m tools.coverage.run --data-file build/coverage/.coverage.literals --metadata build/coverage/literals-run.json -- tests/test_literals.py -v 2>&1 | tee build/coverage/literals-pytest.log
        python -m tools.coverage.report --data-file build/coverage/.coverage.literals --metadata build/coverage/literals-run.json --native-checks literals --output build/coverage/literals.xml 2>&1 | tee build/coverage/literals-report.log

    - name: Upload post-bootstrap Python and Cython coverage to Coveralls
      if: matrix.coverage == true
      uses: coverallsapp/github-action@v2
      with:
        file: coverage.xml
        # The Cobertura uploader ignores XML <sources>; retain repository paths.
        base-path: pyobjus
        fail-on-error: false

    - name: Retain coverage diagnostics
      if: always() && matrix.coverage == true
      uses: actions/upload-artifact@v7
      with:
        name: coverage-macos-py314-${{ github.run_attempt }}
        retention-days: 7
        include-hidden-files: true
        path: |
          coverage.xml
          coverage.json
          .coverage
          build/coverage-run.json
          build/test-libraries.log
          build/coverage/
          pyobjus/*.c
          pyobjus/*.so
          pyobjus/*.pyx
          pyobjus/*.pxi
          pyobjus/*.h
          pyobjus/**/*.py
          setup.py
          pyproject.toml
          tools/coverage/
          .ci/coverage-requirements.txt
          .ci/cicd-requirements.txt

    - name: Retain ordinary build evidence
      if: always() && matrix.coverage != true
      uses: actions/upload-artifact@v7
      with:
        name: ordinary-build-${{ matrix.runs_on }}-py${{ matrix.python }}-${{ github.run_attempt }}
        retention-days: 7
        path: build/ordinary-install.log

  unsupported-platform:
    # pyobjus only builds on macOS and iOS. Elsewhere, building an sdist must
    # still work, and installing must fail with a clear error.
    name: "unsupported platform (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Build sdist
      run: |
        pip install build
        python -m build --sdist

    - name: Install fails with a clear error
      run: |
        if pip install . > install.log 2>&1; then
          cat install.log
          echo "::error::pip install unexpectedly succeeded on Linux"
          exit 1
        fi
        cat install.log
        grep -q "can only be built on macOS or iOS" install.log
